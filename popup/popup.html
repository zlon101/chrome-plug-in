<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>popup</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        outline: none;
      }
      body {
        padding: 8px;
        border-radius: 8px;
      }
      input {
        margin: 8px 0;
      }
      input[type='text'] {
        height: 30px;
        width: 200px;
      }
      input[type='checkbox'] {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      button {
        cursor: pointer;
      }
      .field {
        display: flex;
        align-items: center;
      }
      .field > :first-child {
        margin-right: 4px;
        width: 70px;
      }
      .btn_wrap {
        display: flex;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .btn_wrap > * {
        margin-right: 8px;
        padding: 0 4px;
      }
      .open_search,
      .parse_catalog {
        cursor: pointer;
      }
      .parse_catalog {
        white-space: nowrap;
      }
      .popup-wrap {
        display: flex;
        gap: 12px
      }
      .popup-wrap > span {
        white-space: nowrap;
        cursor: pointer;
      }
      .pick_selector {
        white-space: nowrap;
      }
      .devtools-hint {
        margin-top: 8px;
        font-size: 11px;
        color: #888;
        font-family: monospace;
        display: none;
      }
      .devtools-hint.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="popup-wrap">
      <span class="parse_catalog">目录</span>
      <span class="popup_search">搜索</span>
      <span class="pick_selector">选元素</span>
    </div>
    <div class="devtools-hint" id="devtools_hint">copy(__getSelector($0))</div>
  </body>
  <script type="module" src="./popup.js"></script>
</html>
